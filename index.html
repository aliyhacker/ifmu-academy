ru:{main:"Основной сайт",tag:"Академия для инвесторов IFMU Holding",h1:"Какой вы инвестор?",sub:"10 вопросов, ваш тип инвестора и портфель халяль-ETF. Результат можно скачать картинкой.",go:"Какой я инвестор?",
ab:"Об IFMU Academy",abp:"Бесплатный учебный сайт для инвесторов IFMU Holding. Здесь вы узнаете, что такое акция, облигация и ETF, а тест из 10 вопросов определит ваш тип инвестора и портфель халяль-ETF. Информация носит только информационный характер и не является финансовым советом.",more:"Подробнее",cp:"© 2026 IFMU. Все права защищены.",e0:"Что такое ETF?",e1:"Фонд",e1p:"ETF — фонд, собравший в одну корзину акции множества компаний. Его покупают и продают на бирже как обычную акцию.",e2:"Почему основа?",e2p:"Одной покупкой вы распределяете деньги между сотнями компаний: если одна ошибётся, влияние на весь портфель будет небольшим.",e3:"Халяльный ETF",e3p:"Состоит из компаний, прошедших шариатские фильтры. Фильтры у разных фондов могут немного отличаться, поэтому проверяйте состав.",bt:"Бета: если рынок упадёт на 10%, насколько упадёт акция",btp:"Бета показывает, насколько сильно акция колеблется относительно рынка (за последние 5 лет). Бета 1 — как рынок.",btn:"Это средняя зависимость, а не правило: на цену влияют и собственные новости компании.",view:"Смотреть",pnf:"Изображение портфеля скоро появится.",ph:"Если скачивание не работает, нажмите «Смотреть» и удерживайте изображение, чтобы сохранить.",rt:"Какой бы профиль вы ни выбрали — 5 правил",rl:[["Сначала резерв","запас на 3–6 месяцев расходов — до инвестиций"],["ETF — основа","один ETF охватывает сотни компаний, пусть он станет основой портфеля"],["Одна акция ≤ 10%","даже лучшая компания может ошибиться"],["Понемногу каждый месяц","не пытайтесь «поймать» рынок — добавляйте регулярно"],["Проверяйте халяльность","статус меняется: приложения Zoya, Musaffa или состав ETF"]],nx:"Далее",nf:"Показать результат",bk:"Назад",f1:"Фильтр 1 · Деятельность",f1p:"Исключаются компании, зарабатывающие на:",exc:["Алкоголь","Табак","Свинина","Банки и страхование (проценты)","Азартные игры","Контент для взрослых","Кино и музыка","Онлайн-знакомства","Каннабис"],lim:"Харамный доход не более 5%",f2:"Фильтр 2 · Финансы",f2p:"Каждый показатель меньше 33% рыночной стоимости (среднее за 3 года):",fin:["Общий долг","Деньги и инвестиции под проценты","Дебиторская задолженность"],fm:"Проверка обновляется ежемесячно.",nt:"Важное напоминание",nt1:"Это учебный материал, а не инвестиционная рекомендация. Акции и ETF приведены лишь как пример того, какие компании подходят каждому профилю.",nt2:"Прошлая доходность не гарантирует будущей. Любая акция может как подорожать, так и подешеветь.",it:"О тесте",ip:"{n} коротких вопросов, около 2 минут. Правильных и неправильных ответов нет, выбирайте то, что подходит вашей ситуации. В конце вы получите свой тип инвестора и портфель халяль-ETF картинкой. Результат не является финансовым советом, это только информация.",st:"Начать тест",nav:["Главная","Обучение","ETF","Тест"],lt:"Основные понятия",s1:"Акция",s1p:"Ценная бумага, дающая право стать партнёром компании. «Стань моим партнёром, и будем расти вместе».",hs:"Когда акция соответствует шариату?",
hsp:"<b>Фильтр 1 · Деятельность.</b> Исключаются компании, зарабатывающие на алкоголе, табаке, свинине; традиционных банках и страховании (проценты); азартных играх, контенте для взрослых; кино, музыке, онлайн-знакомствах, каннабисе. Доля харамного дохода не более 5%.<br><br><b>Фильтр 2 · Финансы.</b> Общий долг, деньги и инвестиции под проценты, дебиторская задолженность: каждый показатель меньше 33% рыночной стоимости (среднее за 3 года). Проверка обновляется ежемесячно.",

ab:"About IFMU Academy",abp:"A free learning site for IFMU Holding investors. Learn what stocks, bonds and ETFs are, then a 10-question test finds your investor type and halal ETF portfolio. The information is for information purposes only and is not financial advice.",more:"More",cp:"© 2026 IFMU. All rights reserved.",e0:"What is an ETF?",e1:"A fund",e1p:"An ETF is a fund that puts shares of many companies into one basket. You buy and sell it on an exchange like an ordinary stock.",e2:"Why the core?",e2p:"One purchase spreads your money across hundreds of companies: if one goes wrong, the effect on the whole portfolio is small.",e3:"Halal ETF",e3p:"Built from companies that passed Shariah screens. Screens can differ slightly between funds, so check the holdings.",bt:"Beta: if the market falls 10%, how much does a stock fall",btp:"Beta shows how strongly a stock moves relative to the market (over the last 5 years). Beta 1 means the same as the market.",btn:"This is an average relationship, not a rule: a company’s own news also moves its price.",view:"View",pnf:"The portfolio image will be added soon.",ph:"If download doesn’t work, tap “View” and press and hold the image to save it.",rt:"Whatever your profile — 5 rules",rl:[["Emergency fund first","3–6 months of expenses, before investing"],["ETF as the core","one ETF covers hundreds of companies, make it the base of your portfolio"],["One stock ≤ 10%","even the best company can go wrong"],["A little every month","don’t try to “time” the market, add regularly"],["Check halal status","it changes: Zoya and Musaffa apps, or the ETF holdings"]],nx:"Next",nf:"See result",bk:"Back",f1:"Filter 1 · Business",f1p:"Companies earning from these are excluded:",exc:["Alcohol","Tobacco","Pork","Interest-based banks and insurance","Gambling","Adult content","Cinema and music","Online dating","Cannabis"],lim:"Haram income must not exceed 5%",f2:"Filter 2 · Finances",f2p:"Each must be below 33% of market value (3-year average):",fin:["Total debt","Cash and interest-bearing investments","Receivables"],fm:"Screening is updated monthly.",nt:"Important notice",nt1:"This is educational material, not investment advice. The stocks and ETFs are only examples of which companies could suit each profile.",nt2:"Past returns are not a guarantee of future results. Any stock can rise or fall in value.",it:"About the test",ip:"{n} short questions, about 2 minutes. There are no right or wrong answers, pick what fits your situation. At the end you get your investor type and halal ETF portfolio as an image. The result is not financial advice, only information.",st:"Start the test",nav:["Home","Learn","ETF","Test"],lt:"The basics",s1:"Stock",s1p:"A security that makes you a partner in a company. “Be my partner and let’s grow together.”",hs:"When is a stock Shariah-compliant?",

ru:{t:"Фундаментальный анализ компании",p:"Фундаментальный анализ смотрит не на цену акции, а на саму компанию: сколько она продаёт, сколько зарабатывает и как использует эти деньги. Цель: найти хорошую компанию и купить её по разумной цене.",
m:[["Revenue","Выручка","Все деньги, которые компания получила от продажи товаров и услуг, до вычета расходов.","Объём продаж × цена","Должна стабильно расти из года в год: клиентов становится больше.","Если выручка растёт, а прибыль нет, расходы могут выходить из-под контроля."],
["Net Income","Чистая прибыль","Прибыль, оставшаяся после всех расходов, процентов и налогов.","Выручка − все расходы − налоги","Стабильный рост, а маржа (чистая прибыль ÷ выручка) стабильна или растёт.","Разовые доходы (например, продажа активов) могут искусственно завышать прибыль."],
["EPS","Прибыль на акцию","Часть чистой прибыли, приходящаяся на одну акцию.","Чистая прибыль ÷ число акций","Растущая EPS показывает, что доля акционера укрепляется.","Изменение числа акций меняет EPS: смотрите её вместе с чистой прибылью."],
["P/E","Цена / прибыль","Показывает, во сколько раз цена акции превышает прибыль на одну акцию.","Цена акции ÷ EPS","Сравнивайте с компаниями отрасли и с её собственной историей. P/E 20 значит, что вы платите 20 годовых прибылей.","Низкий P/E не всегда дёшево, высокий может означать ожидание быстрого роста. Универсально «хорошего» числа нет."],
["ROE","Рентабельность капитала","Показывает, сколько прибыли компания приносит на капитал акционеров.","Чистая прибыль ÷ капитал акционеров × 100%","Около 15% и выше на протяжении нескольких лет обычно признак сильного бизнеса (зависит от отрасли).","Большой долг искусственно повышает ROE: проверяйте и долговую нагрузку."],
["Free Cash Flow","Свободный денежный поток","Деньги, которые реально остаются после ведения бизнеса и инвестиций (оборудование, здания).","Операционный денежный поток − капитальные затраты","Положительный и растущий; если близок к чистой прибыли, прибыль подтверждена реальными деньгами.","Прибыль есть, а FCF постоянно отрицательный: будьте осторожны."]],
gl:"Хороший признак",wl:"Внимание",ht:"Анализируйте компанию перед покупкой акции",hp:"Акция — это часть компании. Покупать её, не зная, сколько компания продаёт, зарабатывает и сколько должна, значит играть вслепую. Выручка, чистая прибыль, EPS, P/E, ROE и свободный денежный поток помогают отличить хорошую компанию от случайно выросшей акции.",bn:"Показатели беты относятся к 2026 году. Они постоянно меняются: со временем обновляются в зависимости от состояния рынка и компании.",
ex:"Пример: условная компания",exl:[["Выручка","$100 млн"],["Чистая прибыль","$15 млн"],["EPS","$1,50"],["P/E","20"],["ROE","20%"],["FCF","$14 млн"]],
exn:"Выдуманные цифры для обучения. 10 млн акций, цена $30, капитал $75 млн, операционный денежный поток $22 млн, капзатраты $8 млн. EPS = 15 ÷ 10; P/E = 30 ÷ 1,5; ROE = 15 ÷ 75; FCF = 22 − 8.",
ct:"Как определить хорошую компанию: 5 шагов",
cl:[["Выручка растёт?","За последние 5 лет в основном рост, резких падений мало"],["Прибыль и EPS тоже растут?","Рост вместе с выручкой говорит об эффективном бизнесе"],["ROE высокий, долг умеренный","ROE около 15%+, но не за счёт долга"],["FCF положительный?","Проверьте, превращается ли прибыль в реальные деньги"],["Цена адекватна?","Сравните P/E со средним по отрасли и с историей компании"]],
fn:"Не полагайтесь на один показатель: смотрите на 5-летнюю динамику и на конкурентов. Цифры берите из годового отчёта компании (в США 10-K, SEC EDGAR)."},
en:{t:"Fundamental analysis of a company",p:"Fundamental analysis looks not at the share price but at the company itself: how much it sells, how much it earns and what it does with that money. The goal is to find a good company and buy it at a sensible price.",
m:[["Revenue","Revenue","All the money a company earns from selling goods and services, before costs are subtracted.","Units sold × price","Should grow steadily year after year: it means more customers.","If revenue grows but profit doesn’t, costs may be getting out of control."],
["Net Income","Net income","The profit left after all costs, interest and taxes.","Revenue − all costs − taxes","Steady growth, with a stable or rising margin (net income ÷ revenue).","One-off gains (e.g. selling assets) can inflate profit artificially."],
["EPS","Earnings per share","The part of net income that belongs to one share.","Net income ÷ number of shares","A rising EPS shows each shareholder’s stake is earning more.","A change in share count changes EPS: read it together with net income."],
["P/E","Price / earnings","Shows how many times the share price exceeds earnings per share.","Share price ÷ EPS","Compare with peers in the same industry and with the company’s own history. A P/E of 20 means paying 20 years of current earnings.","A low P/E isn’t always cheap, and a high one may mean fast growth is expected. No universal “good” number exists."],
["ROE","Return on equity","Shows how much profit the company makes on shareholders’ capital.","Net income ÷ shareholders’ equity × 100%","Around 15% or higher over several years usually signals a strong business (varies by industry).","Heavy debt inflates ROE artificially: check the debt level too."],
["Free Cash Flow","Free cash flow","The cash that actually remains after running the business and investing in equipment and buildings.","Operating cash flow − capital expenditure","Positive and growing; if close to net income, profit is backed by real cash.","Profit but constantly negative FCF: be careful."]],
gl:"Good sign",wl:"Watch out",ht:"Analyse the company before you buy a stock",hp:"A stock is a piece of a company. Buying it without knowing how much the company sells, earns and owes is a blind bet. Revenue, net income, EPS, P/E, ROE and free cash flow help tell a good company from a stock that simply went up.",bn:"Beta figures are for 2026. They keep changing: they are updated over time as the market and the company change.",
ex:"Example: a hypothetical company",exl:[["Revenue","$100M"],["Net income","$15M"],["EPS","$1.50"],["P/E","20"],["ROE","20%"],["FCF","$14M"]],
exn:"Made-up numbers for learning. 10M shares, price $30, equity $75M, operating cash flow $22M, capex $8M. EPS = 15 ÷ 10; P/E = 30 ÷ 1.5; ROE = 15 ÷ 75; FCF = 22 − 8.",
ct:"How to spot a good company: 5 steps",
cl:[["Is revenue growing?","Mostly growth over the last 5 years, with few sharp drops"],["Are profit and EPS growing too?","Growing along with revenue shows an efficient business"],["High ROE, moderate debt","ROE around 15%+, but not driven by debt"],["Is FCF positive?","Check that profit turns into real cash"],["Is the price reasonable?","Compare P/E with the industry average and the company’s history"]],
fn:"Don’t rely on one metric: look at the 5-year trend and at competitors. Take numbers from the company’s annual report (10-K in the US, SEC EDGAR)."}

var X={
uz:{
rk:{t:"Aksiya xavflari",in:"Investor faqat foydani emas, pulini yo‘qotish ehtimolini ham tushunishi kerak. Har bir xavfni bosib, batafsil o‘qing.",
m:[
["Market Risk — bozor xavfi","<p>Butun bozor yoki katta soha birga tushishidan keladigan xavf. Kompaniyangiz yaxshi ishlayotgan bo‘lsa ham, bozor tushsa uning narxi ham tushadi. Masalan, 2020-yil mart va 2022-yilda aksiyalar bozori keskin arzonlashgan.</p><ul><li>Diversifikatsiya bu xavfni yo‘q qilmaydi: bozor tushganda deyarli hamma aksiya birga tushadi.</li><li>Bozor odatda vaqt o‘tib tiklangan, lekin qancha vaqt ketishini hech kim oldindan bilmaydi.</li></ul><p class='tp'>Nima qilish: uzoq muddatga (5 yil va undan ko‘p) va yaqin orada kerak bo‘lmaydigan pulni investitsiya qiling.</p>"],
["Company Risk — kompaniya xavfi","<p>Faqat bitta kompaniyaga xos xavf: yomon moliyaviy hisobot, boshqaruv xatosi, raqobatchiga yutqazish, mahsulotdagi nuqson, sud jarayoni yoki bankrotlik. Bunday aksiya bozor o‘sib turganda ham tushishi mumkin.</p><ul><li>Bu xavfni diversifikatsiya sezilarli kamaytiradi: ko‘p kompaniya yoki ETF sotib oling.</li><li>Bitta kompaniya tushsa, butun portfelga ta’siri kichik bo‘lishi kerak.</li></ul><p class='tp'>Nima qilish: bitta aksiyaga portfelning katta qismini solmang va kompaniyani sotib olishdan oldin tahlil qiling (pastdagi «Fundamental tahlil» bo‘limi).</p>"],
["Liquidity Risk — likvidlik xavfi","<p>Aksiyani kerakli paytda va adolatli narxda sota olmaslik xavfi. Kichik va kam savdo qilinadigan kompaniyalarda xaridor kam bo‘ladi, sotish va sotib olish narxi orasidagi farq (spread) katta bo‘ladi. Shoshilib sotsangiz, arzonga sotishga to‘g‘ri keladi.</p><ul><li>Yirik kompaniyalar va ETF’larda likvidlik odatda yuqori.</li><li>Bozor vahimada bo‘lganda likvidlik hamma joyda pasayadi.</li></ul><p class='tp'>Nima qilish: savdo hajmi katta aksiya va ETF’larni tanlang. Yaqin orada kerak bo‘ladigan pulni aksiyaga solmang, favqulodda zaxirani alohida saqlang.</p>"],
["Currency Risk — valyuta xavfi","<p>Aksiya sizning valyutangizdan boshqa valyutada (masalan, AQSh dollarida) bo‘lsa, natijangiz kurs o‘zgarishiga ham bog‘liq bo‘ladi.</p><ul><li>Aksiya narxi 10% o‘sib, dollar sizning valyutangizga nisbatan 10% arzonlashsa, o‘z valyutangizdagi natija taxminan nolga teng bo‘ladi.</li><li>Kurs o‘zingizga foydali tomonga o‘zgarsa, foyda ko‘payadi.</li><li>Pulni o‘tkazish va konvertatsiya qilish xarajatlari ham natijani kamaytiradi.</li></ul><p class='tp'>Nima qilish: kerakli pulingiz qaysi valyutada sarflanishini o‘ylang va konvertatsiya xarajatini hisobga oling.</p>"],
["Inflation Risk — inflyatsiya xavfi","<p>Inflyatsiya pulning xarid qobiliyatini kamaytiradi. Haqiqiy (real) daromad nominal daromaddan inflyatsiyani ayirganga teng.</p><span class='fx'>Real daromad ≈ nominal daromad − inflyatsiya</span><p>Masalan, 6% foyda olsangiz-u, narxlar 8% oshgan bo‘lsa, xarid qobiliyatingiz 2% kamaygan. Naqd pul ham inflyatsiyadan yo‘qotadi. Aksiyalar uzoq muddatda inflyatsiyadan yaxshiroq himoyalashi mumkin, lekin bu kafolat emas.</p><p class='tp'>Nima qilish: foydani nominal emas, inflyatsiyadan keyingi real natija bilan baholang.</p>"],
["Volatility — tebranuvchanlik","<p>Narxning qisqa vaqt ichida keskin ko‘tarilib-tushishi. Tebranishning o‘zi hali zarar emas: zarar aksiyani pastda sotganingizda aniq bo‘ladi. Lekin katta tebranish katta xavfni ham, katta imkoniyatni ham bildiradi.</p><ul><li>Beta ko‘rsatkichi (yuqoridagi bo‘lim) aksiya bozorga nisbatan qanchalik kuchli tebranishini ko‘rsatadi.</li><li>Eng ko‘p uchraydigan xato: vahimaga tushib, narx pastga tushganda sotish.</li></ul><p class='tp'>Nima qilish: oldindan o‘zingizga «portfelim 30% tushsa nima qilaman?» deb javob bering. Testimizdagi savollar aynan shuni aniqlaydi.</p>"]
],
fn:"Hech bir aksiya foydani kafolatlamaydi. Xavfni nolga tushirib bo‘lmaydi, lekin uni tushunib, diversifikatsiya, uzoq muddat va zaxira bilan boshqarish mumkin."},
hl:{t:"Halol aksiyalarga investitsiya qilish",in:"Halol investitsiya foydadan oldin to‘g‘ri tanlov va poklikdan boshlanadi. Bu umumiy ma’lumot, fatvo emas: olimlar o‘rtasida ixtilof bor, aniq masalada ishonchli olim yoki diniy idoradan so‘rang.",
m:[
["Shariat filtrlari qanday ishlaydi?","<p>Aksiya halol hisoblanishi uchun odatda uch narsa tekshiriladi:</p><ul><li><b>Faoliyat filtri.</b> Asosiy faoliyat harom bo‘lmasligi kerak: alkogol, tamaki, cho‘chqa mahsulotlari, qimor, kattalar uchun kontent, foizli bank va sug‘urta kabi.</li><li><b>Moliya filtri.</b> Jami qarz, naqd pul va foizli investitsiyalar, debitorlik qarzlari har biri bozor qiymatining (3 yillik o‘rtacha) 33% idan kam bo‘lishi kerak.</li><li><b>Harom daromad.</b> Foiz va boshqa nojoiz manbalardan daromad jami daromadning 5% idan oshmasligi kerak.</li></ul><p>Tekshiruvni indeks provayderlari (S&amp;P, FTSE, Dow Jones, MSCI kabi) va shariat kengashlari kompaniyalarning hisobotlari asosida muntazam takrorlaydi. Shuning uchun halol ro‘yxat vaqt o‘tib o‘zgaradi.</p><p class='tp'>Nega qarz cheklanadi? Foizli qarz va foizli daromad ribo bilan bog‘liq. Nega 5% ga ruxsat? Bugungi iqtisodda foizdan butunlay xoli yirik kompaniya deyarli yo‘q, shuning uchun olimlar bu ulushga uni poklash sharti bilan yo‘l qo‘ygan (keyingi bo‘lim).</p>"],
["Dividendni poklash (purification)","<p>Halol kompaniya ham juda oz miqdorda harom daromad (masalan, bankdagi foiz) olishi mumkin. Dividendingizning shu harom ulushiga to‘g‘ri keladigan qismini o‘zingizga olmay, savob niyatisiz, muhtojlarga sadaqa qilib berish poklash (purification) deyiladi.</p><span class='fx'>Poklash summasi = dividend × harom daromad ulushi (%)</span><p>Masalan, $100 dividend oldingiz, kompaniyaning harom daromad ulushi 2% bo‘lsa: $100 × 2% = $2 ni xayriyaga berasiz.</p><ul><li>Harom ulush foizini ko‘pincha ETF yoki skrining xizmatlari e’lon qiladi.</li><li>Poklash zakat emas va sadaqa savobi ham emas: bu harom moldan qutulishdir. O‘zingiz va oilangiz bu puldan foydalanmaydi.</li><li>Ko‘p olimlar poklashni faqat dividend uchun talab qiladi; ba’zilari narx o‘sishining tegishli ulushini ham qo‘shadi. Qaysi fikrga amal qilishni olimingizdan so‘rang.</li></ul>"],
["Zakat masalasi","<p>Halol aksiyalar ham zakotga tortiladi. Zakot — nisobga yetgan boylikdan, bir yil (qamariy) o‘tgandan keyin beriladigan 2,5% lik majburiy ulush.</p><ul><li><b>Sotish niyatida olingan aksiyalar</b> (savdo uchun): bozor qiymatining 2,5% i.</li><li><b>Uzoq muddat, dividend uchun saqlanayotgan aksiyalar:</b> ko‘p zamonaviy fatvolarda ehtiyot yo‘l sifatida bozor qiymatining 2,5% i beriladi. Ba’zi olimlar faqat kompaniyaning zakotga tortiladigan aktivlari ulushini hisoblashga ruxsat beradi.</li><li>Olingan dividend bir yil saqlansa, u ham boshqa pul kabi zakotga tortiladi.</li></ul><p>Nisob — taxminan 85 g oltin yoki 595 g kumush qiymati. Qaysi biri olinishi mazhab va olimga bog‘liq: ko‘p hanafiy olimlar kumush nisobini tavsiya qiladi.</p><p>Masalan: aksiyalaringiz bozor qiymati $10 000 va nisobdan oshgan bo‘lsa, yil oxirida $10 000 × 2,5% = $250 zakot hisoblanadi. Zakot hisobida sizning boshqa boyligingiz (naqd, oltin) ham qo‘shiladi va qarzlaringiz ayriladi.</p><p class='tp'>Poklash (harom ulush) va zakot ikki alohida narsa: ikkalasi ham alohida beriladi.</p>"],
["Shariatga mosligi o‘zgargan aksiyani nima qilish kerak?","<p>Kompaniyaning qarzi oshsa, harom daromadi ko‘payib ketsa yoki yangi harom faoliyat qo‘shsa, u halol ro‘yxatdan chiqadi. Bu odatda har chorak yoki oy yangilanadigan tekshiruvda ma’lum bo‘ladi.</p><ul><li>Ko‘pchilik olimlar fikriga ko‘ra, aksiya mos bo‘lmay qolgandan so‘ng oqilona muddat ichida sotish kerak.</li><li>Sotguncha olingan dividendning harom qismini poklang.</li><li>Ba’zi olimlar zarar bilan sotishni majburlamaydi. Bunday holda olimingiz bilan maslahatlashing.</li><li>Aksincha, yangi halol bo‘lgan aksiyani sotib olish mumkin.</li></ul><p class='tp'>Eng oson yo‘l: halol ETF. Fond tarkibini o‘zi yangilab turadi, siz alohida aksiyani kuzatib o‘tirmaysiz.</p>"],
["Sukuk va oddiy obligatsiya farqi","<p>Oddiy obligatsiya qarz qog‘ozi: siz pul berasiz, evaziga foiz olasiz. Islomda foizli qarz ribo hisoblanadi. Sukuk esa aktivga egalikdagi ulushni tasdiqlovchi sertifikat: daromad foizdan emas, aktivdan (masalan, ijaradan yoki biznes foydasidan) keladi.</p><div class='cmp'><div class='c'><h3>Oddiy obligatsiya</h3><p>Qarz beriladi</p><p>Daromad: oldindan belgilangan foiz</p><p>Shariatga ko‘ra: ribo, mumkin emas</p></div><div class='c'><h3>Sukuk</h3><p>Aktivdan ulush olinadi</p><p>Daromad: ijara yoki foyda ulushi</p><p>Shariatga ko‘ra: shartlari bajarilsa mumkin</p></div></div><ul><li>Sukuk turlari: ijara (aktivni ijaraga berish), mudaraba va musharaka (foyda bo‘lishish).</li><li>Sukuk ham xavfsiz emas: emitent to‘lay olmasa, yo‘qotish bo‘lishi mumkin.</li><li>Ba’zi sukuklar tuzilishi bo‘yicha oddiy obligatsiyaga juda o‘xshaydi va olimlar tomonidan tanqid qilinadi, shuning uchun shariat kengashi xulosasiga qarang.</li></ul>"],
["Shariat standartlari o‘rtasidagi farqlar","<p>Halol aksiya ro‘yxatini turli tashkilotlar tuzadi: AAOIFI, S&amp;P, Dow Jones Islamic, FTSE, MSCI va boshqalar. Ularning asosiy printsipi bir xil, lekin chegaralari va hisoblash usuli farq qiladi.</p><ul><li><b>Chegara:</b> qarz va naqd pul uchun odatda 30% dan 33% gacha (masalan, AAOIFI taxminan 30%, S&amp;P taxminan 33%).</li><li><b>Baza:</b> qarz nimaga nisbatan hisoblanadi: bozor qiymatiga yoki jami aktivlarga.</li><li><b>Davr:</b> joriy qiymat, 12 yoki 36 oylik o‘rtacha.</li><li><b>Debitorlik qarzi va naqd pul:</b> ba’zi standartlar ularni alohida cheklaydi.</li><li><b>Harom daromad:</b> deyarli hamma 5% ni asos qiladi.</li></ul><p>Natijada bitta aksiya bir indeksda halol, boshqasida halol emas deb topilishi mumkin. Bu xato emas, bu olimlarning ijtihod farqi.</p><p class='tp'>ETF tanlashda uning qaysi indeksga ergashishini va shariat kengashi kimligini bilib oling. Aniq raqamlar yangilanishi mumkin: provayderning rasmiy saytidan tekshiring.</p>"]
],
fn:"Bu bo‘lim ta’lim uchun umumiy ma’lumot. Zakat va poklashning aniq hisobi uchun ishonchli olim yoki diniy idoraga murojaat qiling."}},
ru:{
rk:{t:"Риски акций",in:"Инвестор должен понимать не только прибыль, но и вероятность потерять деньги. Откройте каждый риск, чтобы прочитать подробнее.",
m:[
["Market Risk — рыночный риск","<p>Риск, связанный с падением всего рынка или крупной отрасли. Даже если ваша компания работает хорошо, при падении рынка её цена тоже снижается. Например, в марте 2020 и в 2022 году рынок акций резко дешевел.</p><ul><li>Диверсификация не убирает этот риск: при падении рынка почти все акции падают вместе.</li><li>Рынок обычно восстанавливался со временем, но сколько это займёт, заранее не знает никто.</li></ul><p class='tp'>Что делать: инвестируйте на долгий срок (5 лет и больше) и только те деньги, которые вам не понадобятся в ближайшее время.</p>"],
["Company Risk — риск компании","<p>Риск, свойственный только одной компании: плохая отчётность, ошибки управления, проигрыш конкурентам, дефект продукта, судебный иск или банкротство. Такая акция может падать даже при растущем рынке.</p><ul><li>Диверсификация заметно снижает этот риск: покупайте много компаний или ETF.</li><li>Падение одной компании должно слабо влиять на весь портфель.</li></ul><p class='tp'>Что делать: не вкладывайте в одну акцию большую часть портфеля и анализируйте компанию перед покупкой (раздел «Фундаментальный анализ» ниже).</p>"],
["Liquidity Risk — риск ликвидности","<p>Риск не суметь продать акцию в нужный момент по справедливой цене. У небольших компаний с малыми объёмами торгов мало покупателей, а разница между ценой покупки и продажи (спред) большая. Если придётся продавать срочно, продадите дёшево.</p><ul><li>У крупных компаний и ETF ликвидность обычно высокая.</li><li>Во время паники на рынке ликвидность падает везде.</li></ul><p class='tp'>Что делать: выбирайте акции и ETF с большими объёмами торгов. Не вкладывайте деньги, которые могут срочно понадобиться, а резерв держите отдельно.</p>"],
["Currency Risk — валютный риск","<p>Если акция торгуется не в вашей валюте (например, в долларах США), результат зависит и от изменения курса.</p><ul><li>Если акция выросла на 10%, а доллар подешевел на 10% к вашей валюте, результат в вашей валюте будет около нуля.</li><li>Если курс изменится в вашу пользу, прибыль вырастет.</li><li>Расходы на перевод и конвертацию тоже уменьшают результат.</li></ul><p class='tp'>Что делать: подумайте, в какой валюте вы будете тратить деньги, и учитывайте расходы на конвертацию.</p>"],
["Inflation Risk — инфляционный риск","<p>Инфляция снижает покупательную способность денег. Реальный доход равен номинальному за вычетом инфляции.</p><span class='fx'>Реальный доход ≈ номинальный доход − инфляция</span><p>Например, вы заработали 6%, а цены выросли на 8%: покупательная способность упала на 2%. Наличные деньги тоже теряют от инфляции. На длинной дистанции акции могут защищать от инфляции лучше, но это не гарантия.</p><p class='tp'>Что делать: оценивайте прибыль не номинально, а в реальном выражении, после инфляции.</p>"],
["Volatility — волатильность","<p>Резкие колебания цены за короткое время. Само по себе колебание ещё не убыток: убыток фиксируется, когда вы продаёте акцию внизу. Но сильные колебания означают и больший риск, и большие возможности.</p><ul><li>Показатель бета (раздел выше) показывает, насколько сильнее акция колеблется относительно рынка.</li><li>Самая частая ошибка: продавать в панике, когда цена упала.</li></ul><p class='tp'>Что делать: заранее ответьте себе, что вы сделаете, если портфель упадёт на 30%. Именно это выявляют вопросы нашего теста.</p>"]
],
fn:"Ни одна акция не гарантирует прибыль. Риск нельзя свести к нулю, но его можно понимать и управлять им: диверсификацией, долгим сроком и резервом."},
hl:{t:"Инвестиции в халяльные акции",in:"Халяльное инвестирование начинается не с прибыли, а с правильного выбора и чистоты. Это общая информация, а не фетва: у учёных есть разногласия, по конкретному вопросу спросите надёжного учёного или религиозную организацию.",
m:[
["Как работают шариатские фильтры?","<p>Чтобы акция считалась халяльной, обычно проверяют три вещи:</p><ul><li><b>Фильтр деятельности.</b> Основная деятельность не должна быть харамной: алкоголь, табак, свинина, азартные игры, контент для взрослых, банки и страхование с процентами и т.п.</li><li><b>Финансовый фильтр.</b> Общий долг, деньги и инвестиции под проценты, дебиторская задолженность: каждый показатель меньше 33% рыночной стоимости (среднее за 3 года).</li><li><b>Харамный доход.</b> Доход от процентов и других недопустимых источников не должен превышать 5% общего дохода.</li></ul><p>Проверку регулярно повторяют поставщики индексов (S&amp;P, FTSE, Dow Jones, MSCI и др.) и шариатские советы на основе отчётов компаний. Поэтому халяльный список со временем меняется.</p><p class='tp'>Почему ограничивают долг? Процентный долг и процентный доход связаны с рибой. Почему допускается 5%? В современной экономике почти нет крупных компаний, полностью свободных от процентов, поэтому учёные допустили эту долю при условии очищения от неё (следующий раздел).</p>"],
["Очищение дивидендов (purification)","<p>Даже халяльная компания может получать совсем небольшой харамный доход (например, проценты на счёте). Та часть вашего дивиденда, которая приходится на этот харамный доход, не оставляется себе, а отдаётся нуждающимся без намерения получить награду. Это и называется очищением (purification).</p><span class='fx'>Сумма очищения = дивиденд × доля харамного дохода (%)</span><p>Например, вы получили $100 дивидендов, доля харамного дохода компании 2%: $100 × 2% = $2 отдаёте на благотворительность.</p><ul><li>Процент харамной доли часто публикуют ETF или скрининговые сервисы.</li><li>Очищение не закят и не обычная садака: это избавление от харамных средств. Вы и ваша семья этими деньгами не пользуетесь.</li><li>Многие учёные требуют очищать только дивиденды; некоторые добавляют и соответствующую часть роста цены. Спросите своего учёного, какого мнения придерживаться.</li></ul>"],
["Вопрос закята","<p>Халяльные акции тоже облагаются закятом. Закят — обязательные 2,5% от имущества, достигшего нисаба, по прошествии одного (лунного) года.</p><ul><li><b>Акции, купленные для перепродажи</b> (торговля): 2,5% рыночной стоимости.</li><li><b>Акции, которые держат долго ради дивидендов:</b> во многих современных фетвах как осторожный вариант берут 2,5% рыночной стоимости. Некоторые учёные разрешают считать только долю закятных активов компании.</li><li>Полученные дивиденды, если их хранят год, облагаются закятом как обычные деньги.</li></ul><p>Нисаб — примерно стоимость 85 г золота или 595 г серебра. Что брать за основу, зависит от мазхаба и учёного: многие ханафитские учёные советуют нисаб по серебру.</p><p>Например: рыночная стоимость акций $10 000 и она выше нисаба, значит по итогам года закят: $10 000 × 2,5% = $250. В расчёт закята добавляется и прочее ваше имущество (наличные, золото), а долги вычитаются.</p><p class='tp'>Очищение (харамная доля) и закят — разные вещи: каждое отдаётся отдельно.</p>"],
["Что делать, если акция перестала соответствовать шариату?","<p>Если у компании вырос долг, увеличился харамный доход или появилась новая харамная деятельность, она выходит из халяльного списка. Это обычно видно при проверке, которая обновляется каждый квартал или месяц.</p><ul><li>По мнению большинства учёных, акцию нужно продать в разумный срок после того, как она перестала соответствовать.</li><li>До продажи очистите харамную часть полученных дивидендов.</li><li>Некоторые учёные не требуют продавать с убытком. В таком случае проконсультируйтесь со своим учёным.</li><li>И наоборот, можно покупать акции, ставшие халяльными.</li></ul><p class='tp'>Самый простой путь: халяльный ETF. Фонд сам обновляет состав, и вам не нужно следить за каждой акцией.</p>"],
["Разница между сукук и обычной облигацией","<p>Обычная облигация — долговая бумага: вы даёте деньги и получаете проценты. В исламе процентный заём считается рибой. Сукук же — сертификат, подтверждающий долю владения активом: доход идёт не от процентов, а от актива (например, от аренды или прибыли бизнеса).</p><div class='cmp'><div class='c'><h3>Обычная облигация</h3><p>Даётся заём</p><p>Доход: заранее заданный процент</p><p>По шариату: риба, нельзя</p></div><div class='c'><h3>Сукук</h3><p>Приобретается доля в активе</p><p>Доход: аренда или доля прибыли</p><p>По шариату: можно при соблюдении условий</p></div></div><ul><li>Виды сукук: иджара (аренда актива), мудараба и мушарака (разделение прибыли).</li><li>Сукук тоже не безопасен: если эмитент не сможет заплатить, возможны потери.</li><li>Некоторые сукук по структуре очень похожи на обычную облигацию, и учёные их критикуют, поэтому смотрите заключение шариатского совета.</li></ul>"],
["Различия между шариатскими стандартами","<p>Халяльные списки акций составляют разные организации: AAOIFI, S&amp;P, Dow Jones Islamic, FTSE, MSCI и другие. Основной принцип у них одинаков, но пороги и методика расчёта отличаются.</p><ul><li><b>Порог:</b> для долга и денег обычно от 30% до 33% (например, у AAOIFI около 30%, у S&amp;P около 33%).</li><li><b>База:</b> относительно чего считается долг: рыночной стоимости или суммарных активов.</li><li><b>Период:</b> текущее значение, среднее за 12 или 36 месяцев.</li><li><b>Дебиторка и деньги:</b> некоторые стандарты ограничивают их отдельно.</li><li><b>Харамный доход:</b> почти везде основа 5%.</li></ul><p>В итоге одна акция может быть халяльной в одном индексе и нехаляльной в другом. Это не ошибка, а разница в иджтихаде учёных.</p><p class='tp'>При выборе ETF узнайте, за каким индексом он следует и кто его шариатский совет. Точные цифры могут обновляться: проверяйте на официальном сайте поставщика.</p>"]
],
fn:"Этот раздел даёт общую образовательную информацию. Для точного расчёта закята и очищения обратитесь к надёжному учёному или религиозной организации."}},
en:{
rk:{t:"Stock risks",in:"An investor should understand not only the profit but also the chance of losing money. Open each risk to read more.",
m:[
["Market Risk","<p>The risk that the whole market or a large sector falls together. Even if your company is doing well, its price falls when the market falls. For example, stock markets dropped sharply in March 2020 and in 2022.</p><ul><li>Diversification does not remove this risk: when the market falls, almost all stocks fall together.</li><li>Markets have usually recovered over time, but nobody knows in advance how long it takes.</li></ul><p class='tp'>What to do: invest for the long term (5 years or more) and only money you won’t need soon.</p>"],
["Company Risk","<p>A risk specific to one company: a poor financial report, management mistakes, losing to a competitor, a product defect, a lawsuit or bankruptcy. Such a stock can fall even when the market is rising.</p><ul><li>Diversification reduces this risk noticeably: buy many companies or an ETF.</li><li>If one company falls, the effect on the whole portfolio should be small.</li></ul><p class='tp'>What to do: don’t put a large part of your portfolio into one stock, and analyse a company before buying (see “Fundamental analysis” below).</p>"],
["Liquidity Risk","<p>The risk of not being able to sell a stock when you need to, at a fair price. Small, thinly traded companies have few buyers and a wide gap between the buying and selling price (the spread). If you must sell in a hurry, you sell cheap.</p><ul><li>Large companies and ETFs usually have high liquidity.</li><li>When the market panics, liquidity drops everywhere.</li></ul><p class='tp'>What to do: choose stocks and ETFs with large trading volumes. Don’t invest money you may need soon, and keep your emergency fund separately.</p>"],
["Currency Risk","<p>If a stock is priced in a currency other than your own (for example US dollars), your result also depends on exchange rate moves.</p><ul><li>If the stock rises 10% and the dollar falls 10% against your currency, your result in your own currency is about zero.</li><li>If the rate moves in your favour, your profit grows.</li><li>Transfer and conversion costs also reduce the result.</li></ul><p class='tp'>What to do: think about which currency you will spend the money in, and count the conversion costs.</p>"],
["Inflation Risk","<p>Inflation reduces what your money can buy. Real return equals nominal return minus inflation.</p><span class='fx'>Real return ≈ nominal return − inflation</span><p>For example, if you earn 6% while prices rise 8%, your purchasing power fell 2%. Cash loses to inflation too. Over the long term stocks may protect against inflation better, but this is not guaranteed.</p><p class='tp'>What to do: judge returns in real terms, after inflation, not just nominal ones.</p>"],
["Volatility","<p>Sharp ups and downs in price over a short time. A swing alone is not yet a loss: the loss becomes real when you sell low. But big swings mean both bigger risk and bigger opportunity.</p><ul><li>Beta (the section above) shows how much more a stock swings than the market.</li><li>The most common mistake: panic-selling after the price has dropped.</li></ul><p class='tp'>What to do: decide in advance what you will do if your portfolio falls 30%. The questions in our test measure exactly this.</p>"]
],
fn:"No stock guarantees a profit. Risk can’t be reduced to zero, but it can be understood and managed with diversification, a long horizon and an emergency fund."},
hl:{t:"Investing in halal stocks",in:"Halal investing starts with the right choice and purity, before profit. This is general information, not a fatwa: scholars differ, so for a specific question ask a trusted scholar or religious authority.",
m:[
["How do Shariah screens work?","<p>For a stock to count as halal, three things are usually checked:</p><ul><li><b>Business screen.</b> The main business must not be haram: alcohol, tobacco, pork, gambling, adult content, interest-based banking and insurance and the like.</li><li><b>Financial screen.</b> Total debt, cash and interest-bearing investments, and receivables must each be below 33% of market value (3-year average).</li><li><b>Haram income.</b> Income from interest and other impermissible sources must not exceed 5% of total income.</li></ul><p>Index providers (such as S&amp;P, FTSE, Dow Jones, MSCI) and Shariah boards repeat the screening regularly based on company reports. That is why the halal list changes over time.</p><p class='tp'>Why is debt limited? Interest-bearing debt and interest income are tied to riba. Why is 5% tolerated? In today’s economy almost no large company is entirely free of interest, so scholars allowed this share on the condition that it is purified (next section).</p>"],
["Purifying dividends","<p>Even a halal company may earn a very small amount of haram income (for example interest on a bank account). The part of your dividend that corresponds to that haram income is not kept: you give it to people in need without expecting reward. This is called purification.</p><span class='fx'>Purification amount = dividend × haram income share (%)</span><p>For example, you received a $100 dividend and the company’s haram income share is 2%: $100 × 2% = $2 goes to charity.</p><ul><li>The haram percentage is often published by ETFs or screening services.</li><li>Purification is not zakat and not ordinary charity: it is getting rid of impermissible money. You and your family do not benefit from it.</li><li>Many scholars require purification of dividends only; some also include the corresponding part of price gains. Ask your scholar which view to follow.</li></ul>"],
["The question of zakat","<p>Halal stocks are also subject to zakat. Zakat is a mandatory 2.5% on wealth that reaches the nisab, after one lunar year has passed.</p><ul><li><b>Stocks bought to resell</b> (trading): 2.5% of market value.</li><li><b>Stocks held long term for dividends:</b> many modern fatwas take 2.5% of market value as the cautious approach. Some scholars allow calculating only the share of the company’s zakatable assets.</li><li>Dividends received and kept for a year are subject to zakat like any other cash.</li></ul><p>The nisab is roughly the value of 85 g of gold or 595 g of silver. Which one is used depends on the school and the scholar: many Hanafi scholars recommend the silver nisab.</p><p>For example: if your stocks are worth $10,000 and above the nisab, the zakat at year-end is $10,000 × 2.5% = $250. Your other wealth (cash, gold) is added in the calculation and your debts are deducted.</p><p class='tp'>Purification (the haram share) and zakat are two different things: each is given separately.</p>"],
["What if a stock stops being Shariah-compliant?","<p>If a company’s debt grows, its haram income rises or it adds a new haram activity, it drops out of the halal list. This usually shows up in the screening, which is updated every quarter or month.</p><ul><li>Most scholars say the stock should be sold within a reasonable time after it stops being compliant.</li><li>Until you sell, purify the haram part of any dividends received.</li><li>Some scholars do not require selling at a loss. In that case, consult your scholar.</li><li>Conversely, you may buy stocks that have become halal.</li></ul><p class='tp'>The easiest route: a halal ETF. The fund updates its holdings itself, so you don’t have to track each stock.</p>"],
["Sukuk vs a conventional bond","<p>A conventional bond is a debt instrument: you lend money and receive interest. In Islam, interest-bearing loans are riba. A sukuk is a certificate of ownership in an asset: the return comes not from interest but from the asset (for example rent or business profit).</p><div class='cmp'><div class='c'><h3>Conventional bond</h3><p>A loan is given</p><p>Return: a fixed interest rate</p><p>Under Shariah: riba, not permitted</p></div><div class='c'><h3>Sukuk</h3><p>You own a share of an asset</p><p>Return: rent or a share of profit</p><p>Under Shariah: permitted if conditions are met</p></div></div><ul><li>Types of sukuk: ijara (leasing an asset), mudaraba and musharaka (profit sharing).</li><li>Sukuk are not risk-free: if the issuer can’t pay, losses are possible.</li><li>Some sukuk are structured very much like conventional bonds and are criticised by scholars, so look at the Shariah board’s opinion.</li></ul>"],
["Differences between Shariah standards","<p>Different organisations compile halal stock lists: AAOIFI, S&amp;P, Dow Jones Islamic, FTSE, MSCI and others. The core principle is the same, but thresholds and calculation methods differ.</p><ul><li><b>Threshold:</b> usually 30% to 33% for debt and cash (for example AAOIFI about 30%, S&amp;P about 33%).</li><li><b>Base:</b> what debt is measured against: market value or total assets.</li><li><b>Period:</b> current value, or a 12 or 36-month average.</li><li><b>Receivables and cash:</b> some standards limit them separately.</li><li><b>Haram income:</b> almost everyone uses 5%.</li></ul><p>As a result one stock can be halal in one index and not halal in another. This is not an error but a difference in scholars’ ijtihad.</p><p class='tp'>When choosing an ETF, find out which index it follows and who its Shariah board is. Exact figures can change: check the provider’s official website.</p>"]
],
fn:"This section is general educational information. For an exact zakat and purification calculation, consult a trusted scholar or religious authority."}}
